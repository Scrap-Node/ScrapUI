# Publication de @scrap-node/scrap-ui sur npmjs.com, en public, déclenchée par un
# tag vX.Y.Z. Le jeton de publication est le secret NPM_TOKEN du dépôt ; la
# provenance (id-token) relie chaque version publiée au commit et au workflow qui
# l'ont produite.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Le tag est la source de vérité de la version : un décalage avec package.json
      # produirait une release dont le numéro ne veut rien dire.
      - name: Vérifier que le tag correspond à la version de la lib
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./projects/scrap-ui/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG ≠ package.json $PKG"
            exit 1
          fi

      # Un tag ne doit jamais publier ce qui ne passe pas la CI : le tag est
      # posé sur un commit, mais rien ne garantit que la CI a tourné dessus.
      - run: npm run lint
      - run: npm run test:lib
      - run: npm run test:schematics

      # La lib et sa feuille CSS compilée (css/scrap-ui.css), pour les projets sans Angular
      - run: npm run build

      # Accès public, provenance et registre viennent du publishConfig du paquet
      - name: Publier
        working-directory: dist/scrap-ui
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
