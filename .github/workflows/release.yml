# Publication de @scrapnode/scrap-ui sur npmjs.com, en public, déclenchée par un
# tag vX.Y.Z. Aucun jeton : le paquet fait confiance à ce workflow (Trusted
# Publisher, réglé sur npmjs.com) et npm l'authentifie par OIDC, d'où id-token.
# La provenance relie chaque version publiée au commit et au workflow qui l'ont
# produite.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La publication de confiance demande npm 11.5.1 ou plus : Node 22 livre
          # npm 10, Node 24 livre npm 11.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Le tag est la source de vérité de la version : un décalage avec package.json
      # produirait une release dont le numéro ne veut rien dire.
      - name: Vérifier que le tag correspond à la version de la lib
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./projects/scrap-ui/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG ≠ package.json $PKG"
            exit 1
          fi

      # Un tag ne doit jamais publier ce qui ne passe pas la CI : le tag est
      # posé sur un commit, mais rien ne garantit que la CI a tourné dessus.
      - run: npm run lint
      - run: npm run test:lib
      - run: npm run test:schematics

      # La lib et sa feuille CSS compilée (css/scrap-ui.css), pour les projets sans Angular
      - run: npm run build

      # Accès public, provenance et registre viennent du publishConfig du paquet
      - name: Publier
        working-directory: dist/scrap-ui
        run: npm publish
