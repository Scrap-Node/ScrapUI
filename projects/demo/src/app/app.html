<scrap-header appName="Scrap UI" homeHref="/fondations">
  <span logo class="logo" aria-hidden="true"><scrap-icon name="node" [size]="18" /></span>
  <button actions scrap-icon-button label="Commandes" shortcut="mod+k" (click)="commands.open()">
    <scrap-icon name="command" />
  </button>
  <scrap-theme-toggle actions />
</scrap-header>

<div class="shell">
  <nav class="stories" aria-label="Pages de la vitrine">
    @for (group of groups; track group.name) {
      <p class="stories-group" [id]="'nav-' + $index">{{ group.name }}</p>
      <ul [attr.aria-labelledby]="'nav-' + $index">
        @for (story of group.stories; track story.path) {
          <li>
            <a [routerLink]="story.path" routerLinkActive="on" ariaCurrentWhenActive="page">{{
              story.title
            }}</a>
          </li>
        }
      </ul>
    }
  </nav>

  <main id="contenu">
    <router-outlet />
  </main>
</div>

<scrap-footer appName="Scrap UI">
  <span>Les jetons, les composants Angular et la feuille CSS des projets Scrap Node.</span>
</scrap-footer>

<scrap-toasts />
<scrap-command-palette />
